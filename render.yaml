services:
  - type: web
    name: freshfusion
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: freshfusion
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENTS_KEY_SECRET
        sync: false
      - key: CUSTOMER_AUTH_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
